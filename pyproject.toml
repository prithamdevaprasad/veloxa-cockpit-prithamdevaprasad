[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veloxa-cockpit"
version = "0.1.0"
description = "Veloxa CXO Cockpit: evidence ledger foundation (Day 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<3.4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pdfplumber>=0.11,<0.12",
  "dbos>=3.5,<3.6",            # C26 durable workflows (ARCHITECTURE.md §17.2), MIT; owner-approved 17 Nov 2026
  "psycopg-pool>=3.2,<3.3",    # optional API connection pool (VELOXA_DB_POOL_MAX)
  "httpx>=0.27,<1",            # connectors (Jira, Gmail, GitHub) call their APIs over HTTPS
  "cryptography>=43",          # GitHub App JWT, encrypted token storage
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",          # 9.0.3 fixes PYSEC-2026-1845 (shared /tmp/pytest-of-{user} directories on UNIX)
  "httpx>=0.27,<1",
  "pytest-timeout>=2.4,<3",    # a hung test fails visibly instead of stalling the run
  "ruff>=0.6,<1",
]
# Owner-approved Gemini experiment (synthetic tenants only). Optional: never installed in CI or production images;
# the adapter imports it lazily, and the tests use a mocked client.
gemini = [
  "google-genai==2.34.0",
]

[project.scripts]
veloxa = "veloxa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veloxa = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Per-test ceiling. The slowest test takes about 7 s (DBOS crash recovery); 300 s only catches real hangs.
timeout = 300
markers = [
  "db: needs a PostgreSQL 18 server (VELOXA_TEST_ADMIN_DSN)",
  "realdata: needs the locally supplied release packs (VELOXA_DATA_PATH); never runs in CI",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]   # S: flake8-bandit security rules (SAST, Sprint 10)

[tool.ruff.lint.per-file-ignores]
# Tests assert, use synthetic credentials and fixed SQL/process fixtures by design.
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S311", "S603", "S607", "S608"]
