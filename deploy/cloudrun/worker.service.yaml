# Cloud Run service: Veloxa background worker (data-room intake, DBOS workflows, scheduled connector syncs).
# Always on, CPU always allocated, NO public ingress. NOT applied by any script. Deploy with:
#   gcloud run services replace deploy/cloudrun/worker.service.yaml --region asia-south1 --project ${PROJECT}
# Why a separate always-on service: request-based Cloud Run instances are CPU-throttled between requests and may
# scale to zero, so in-process background work would stall or be lost. DBOS keeps each workflow's progress in its
# own PostgreSQL database; when this instance restarts, DBOS recovers and resumes the pending workflows it owns
# (stable executor id below). Exactly one instance (min=max=1) avoids two executors competing for the same work.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: veloxa-worker
  labels: {app: veloxa, env: staging}
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"      # instance-based billing: CPU between requests
        run.googleapis.com/cloudsql-instances: "${SQL_CONN}"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: "veloxa-worker@${PROJECT}.iam.gserviceaccount.com"
      containers:
        - image: "${IMAGE}"
          # A tiny health listener keeps Cloud Run satisfied; the real work is the intake loop.
          command: ["sh", "-c"]
          args: ["python -m http.server ${PORT} --directory /tmp >/dev/null 2>&1 & exec veloxa intake-work --interval 10"]
          ports: [{containerPort: 8080}]
          resources: {limits: {cpu: "1", memory: 1Gi}}
          env:
            - {name: VELOXA_DB_HOST, value: "/cloudsql/${SQL_CONN}"}
            - {name: VELOXA_DB_NAME, value: veloxa}
            - {name: VELOXA_ORIGINALS_DIR, value: /mnt/evidence/originals}
            - {name: VELOXA_TOKEN_DIR, value: /mnt/evidence/tokens}
            - {name: VELOXA_INGEST_PARSE_ISOLATION, value: "1"}
            # DBOS recovery uses the fixed executor id in src/veloxa/workflows/runner.py (EXECUTOR_ID); with one
            # instance that id is stable across restarts. Make it configurable before running >1 worker.
            - name: VELOXA_INGEST_PASSWORD
              valueFrom: {secretKeyRef: {name: veloxa-db-ingest-password, key: latest}}
            - name: VELOXA_PROJECTION_PASSWORD
              valueFrom: {secretKeyRef: {name: veloxa-db-projection-password, key: latest}}
            - name: VELOXA_WORKFLOW_DATABASE_URL
              valueFrom: {secretKeyRef: {name: veloxa-workflow-db-url, key: latest}}
            - name: VELOXA_TOKEN_KEY
              valueFrom: {secretKeyRef: {name: veloxa-token-key, key: latest}}
          volumeMounts: [{name: evidence, mountPath: /mnt/evidence}]
      volumes:
        - name: evidence
          csi: {driver: gcsfuse.run.googleapis.com, volumeAttributes: {bucketName: "${BUCKET}"}}
