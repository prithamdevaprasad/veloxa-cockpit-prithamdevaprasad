# Source catalogue: how each file in a release pack is classified on admission.
# Rules are matched in order against the path relative to the pack folder (glob syntax).
# Fields:
#   kind        : what the file is (export, document, email, transcript, brief, readme, template)
#   system      : source system the file comes from (as named in the data room README)
#   data_class  : ARCHITECTURE.md §6.3 data class. D1 mapping approved by the owner (ASSUMPTIONS.md A-024);
#                 classes for later packs are drafts until approved.
#   records     : how records are extracted: "rows" (one per spreadsheet data row), "document" (one per file),
#                 or "none" (registered in the raw manifest only; never admitted as evidence)
#   row_class   : optional per-row override, {column = value} -> data_class, for mixed exports
#   contract    : optional validation contract for row exports (required columns, uniqueness, ISO dates,
#                 numeric types, arithmetic identities). A violation refuses the whole pack (fail closed).
# The most restrictive class is used where a source mixes content. Unmatched files are rejected (fail closed).

[[rule]]
pattern = "brief/*.docx"
kind = "brief"
system = "challenge_brief"
data_class = "internal"
records = "document"

[[rule]]
pattern = "data_room/README.txt"
kind = "readme"
system = "data_room"
data_class = "internal"
records = "document"

[[rule]]
pattern = "data_room/templates/*"
kind = "template"
system = "data_room"
data_class = "internal"
records = "none"

[[rule]]
pattern = "data_room/hr/Employee_Master.xlsx"
kind = "export"
system = "keka_hrms"
data_class = "personal"
records = "rows"
[rule.contract]
required_columns = ["Emp ID", "Full Name", "Department", "Title", "Manager ID", "Join Date", "Status", "Exit Date"]
optional = ["Manager ID", "Exit Date"]
unique = ["Emp ID"]
iso_dates = ["Join Date", "Exit Date"]

[[rule]]
pattern = "data_room/finance/Payroll_Register_*.xlsx"
kind = "export"
system = "payroll_register"
data_class = "sensitive_personal"
records = "rows"
[rule.contract]
required_columns = ["Emp ID", "Month", "Days in Month", "Days Payable", "Gross (Rs.)", "Deductions (Rs.)", "Net (Rs.)", "Processed By"]
month_labels = ["Month"]
integers = ["Days in Month", "Days Payable", "Gross (Rs.)", "Deductions (Rs.)", "Net (Rs.)"]
identities = [["Gross (Rs.)", "Deductions (Rs.)", "Net (Rs.)"]]
not_greater = [["Days Payable", "Days in Month"]]

[[rule]]
pattern = "data_room/finance/GL_Export_*.xlsx"
kind = "export"
system = "zoho_books"
data_class = "confidential"
records = "rows"
# Ledger payroll lines are payroll aggregates (ARCHITECTURE.md §15.3).
row_class = { "Vendor / Payee" = "Salaries (payroll)", class = "payroll_aggregate" }
[rule.contract]
required_columns = ["Txn Date", "Voucher", "Vendor / Payee", "Cost Centre", "Amount (Rs.)", "Narration"]
unique = ["Voucher"]
iso_dates = ["Txn Date"]
integers = ["Amount (Rs.)"]

[[rule]]
pattern = "data_room/documents/*.pdf"
kind = "document"
system = "documents"
data_class = "confidential"
records = "document"

[[rule]]
pattern = "data_room/email/*.eml"
kind = "email"
system = "email"
data_class = "private_comms"
records = "document"

[[rule]]
pattern = "transcripts/*.docx"
kind = "transcript"
system = "meeting_summaries"
data_class = "confidential"
records = "document"

# ---- D2 / D3 sources (owner decision 18 Nov 2026, K-13: approved source by source; see
# config/admission_authorisations.toml). Contracts mirror the validated parsers (ingest/people_contracts.py and
# the D3 engineering contracts). Nothing here interprets a value or resolves an identity (C12 decides links).

[[rule]]
pattern = "data_room/hr/Hiring_Tracker.xlsx"
kind = "export"
system = "hiring_tracker"
# Requisitions name hiring managers and recruiter notes may mention candidates: the whole file is `personal`
# (the stricter of the proposed classes, because a column cannot be classed on its own).
data_class = "personal"
records = "rows"
key_columns = ["Req ID"]
[rule.contract]
required_columns = ["Req ID", "Role", "Team", "Hiring Manager", "Opened", "Status", "Status Date", "In pipeline", "Notes"]
optional = ["Notes"]
unique = ["Req ID"]
iso_dates = ["Opened", "Status Date"]
integers = ["In pipeline"]

[[rule]]
pattern = "data_room/hr/Leave_Register.xlsx"
kind = "export"
system = "leave_register"
# Leave type is protected (ARCHITECTURE.md §16.6): never availability, never shown to agents (K-03).
data_class = "sensitive_personal"
records = "rows"
[rule.contract]
required_columns = ["Employee", "Leave Type", "From", "To", "Days", "Approved By"]
iso_dates = ["From", "To"]
numbers = ["Days"]

[[rule]]
pattern = "data_room/hr/Pulse_Survey.xlsx"
kind = "export"
system = "pulse_survey"
# Team-level scores only as published; the source suppresses comment text ("Not shown").
data_class = "confidential"
records = "rows"
[rule.contract]
required_columns = ["Quarter", "Team", "Team size", "Responses", "Engagement (1-5)", "Comments"]
integers = ["Team size", "Responses"]
numbers = ["Engagement (1-5)"]
not_greater = [["Responses", "Team size"]]

[[rule]]
pattern = "data_room/email/Email_Printouts.pdf"
kind = "document"
system = "email_printouts"
# Printed copies of the EML messages: duplicate evidence, never independent corroboration.
data_class = "private_comms"
records = "document"

[[rule]]
pattern = "data_room/engineering/git_log.csv"
kind = "export"
system = "git"
# Allocation evidence only: never productivity, never after-hours analysis (§16.6, POL-PROD-01).
data_class = "internal"
records = "rows"
key_columns = ["sha"]
[rule.contract]
required_columns = ["sha", "author_email", "committed_at", "repo", "message", "files_changed"]
unique = ["sha"]
integer_text = ["files_changed"]

[[rule]]
pattern = "data_room/engineering/Incidents_*.xlsx"
kind = "export"
system = "incident_log"
data_class = "internal"
records = "rows"
key_columns = ["ID"]
[rule.contract]
required_columns = ["ID", "Severity", "Opened", "Resolved", "Service", "Responder"]
optional = ["Resolved"]
unique = ["ID"]

[[rule]]
pattern = "data_room/engineering/Jira_Export_*.xlsx"
kind = "export"
system = "jira"
# Issues and Versions sheets; the Epics sheet has no header row and its second column is uninterpreted (K-09),
# so it is not extracted. Assignee and Changed By are SOURCE identifiers.
data_class = "internal"
records = "rows"
key_columns = ["Key"]
[rule.contract]
sheet = "Issues"
required_columns = ["Key", "Type", "Summary", "Epic Link", "Assignee", "Story Points", "Status", "Created", "Resolved", "Fix Version"]
optional = ["Epic Link", "Assignee", "Story Points", "Resolved", "Fix Version"]
unique = ["Key"]
iso_dates = ["Created", "Resolved"]
numbers = ["Story Points"]

[[rule]]
pattern = "data_room/engineering/OnCall_Rota.xlsx"
kind = "export"
system = "oncall_rota"
data_class = "internal"
records = "rows"
key_columns = ["Week of"]
[rule.contract]
required_columns = ["Week of", "Primary", "Secondary"]
optional = ["Secondary"]
unique = ["Week of"]
iso_dates = ["Week of"]
